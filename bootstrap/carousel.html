<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carousel</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</head>

<body>

    <div class="carousel slide" data-bs-ride="carousel" id="banner">
        <div class="carousel-inner">
            <div class="carousel-item active " data-bs-interval="1000">
                <img src="../public/images/Next-Gen.png" alt="" class="w-100 d-block" height="400px" >
            </div>

            <div class="carousel-item" data-bs-interval="1000">
                <img src="../public/images/Data_Sci.jpg" alt="" class="w-100 d-block" height="400px">
            </div>

            <div class="carousel-item" data-bs-interval="1000">
                <img src="../public/images/DevOps.jpg" alt="" class="w-100 d-block" height="400px">
            </div>
        </div>


        <button class="carousel-control-prev" data-bs-slide="prev"  data-bs-target="#banner">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" data-bs-slide="next"  data-bs-target="#banner">
            <span class="carousel-control-next-icon"></span>
        </button>


        <div class="carousel-indicators">
            <button class="active" data-bs-slide-to="0" data-bs-target="#banner"></button>
            <button class="active" data-bs-slide-to="1" data-bs-target="#banner"></button>
            <button class="active" data-bs-slide-to="2" data-bs-target="#banner"></button>
        </div>
    </div>
</body>

</html>
