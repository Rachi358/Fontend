<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMICalculator</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

    <script src="../src/scripts/emicalculator.js"></script>

</head>

<body class="bg-secondary p-3 d-flex justify-content-center">

    <div class="bg-light w-100 p-4 mt-3 text-center">

        <div class="fs-1 fw-bold"> Personal Loan EMI Calculator </div>

        <div class="fs-5">Table Out our Guess Work from Financial Planning </div>    

        <div class="mt-4 row">

            <div class="col-7 p-4">

                <div  style="background-color: rgb(209, 209, 243);" class="p-3 rounded text-black rounded-2">

                    <div class="d-flex justify-content-between">

                       <span>Amount You Need</span>

                       <input type="text" id="txtAmount">     

                    </div>

                    <div class="mb-4">

                        <input type="range" onchange="AmountChange()" id="rangeAmount" min="100000" value="100000" class="form-range" max="1000000">

                        <div class="mb-3">

                            <span class="float-start">&#8377; 1,00,000/-</span>

                            <span class="float-end">&#8377; 10,00,000/-</span>

                        </div>

                    </div>



                    <div class="d-flex mt-3 pt-3 justify-content-between">

                       <span>Loan Tenure</span>

                       <input type="text" id="txtYear" size="2">     

                    </div>

                    <div class="mb-4">

                        <input type="range" onchange="YearChange()" id="rangeYears" min="1" value="1" class="form-range" max="5">

                        <div>

                            <span class="float-start">1 Year</span>

                            <span class="float-end">5 Years</span>

                        </div>

                    </div>              



                    <div class="d-flex mt-3 pt-3 justify-content-between">

                       <span>Interest Rate</span>

                       <span>

                        <input type="text" id="txtRate" size="4"> %

                       </span>     

                    </div>

                    <div class="mb-4">

                        <input type="range" onchange="RateChange()" id="rangeRate" min="10.45" value="10.45" class="form-range" max="18.45">

                        <div>

                            <span class="float-start">10.45%</span>

                            <span class="float-end">18.45%</span>

                        </div>

                    </div>





                </div>

            </div>

            <div class="col-5 p-4">

                <div  style="background-color: rgb(209, 209, 243);"class=" p-3 rounded text-black rounded-2">

                    <div class="bg-primary text-white text-center p-2 mb-3">

                        Your Monthly Installment

                        <div class="fs-2 fw-bold" id="lblInstallment"></div>

                    </div>

                    <dl class="row">

                        <dt class="col-6">Amount Payable</dt>

                        <dd class="col-6">45,00,000</dd>

                        <dt class="col-6">Interest Amount</dt>

                        <dd class="col-6">20,00,00</dd>

                        <dt class="col-6">Principle Amount</dt>

                        <dd class="col-6">42,00,000</dd>

                    </dl>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
