<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculaotr</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="../src/scripts/bmi.js"></script>
</head>
<body>
    <div class="bg-secondary rounded m-5 p-5">
        <div>
            <form action="" class="p-3">
                <div class="gender d-flex flex-row">
                    <div>
                        <label for="">Male</label>
                        <input type="radio" name="" id="">
                    </div>
                    <div>
                        <label for="" class="form-labal">Female</label>
                        <input type="radio">
                    </div>
                </div>

                <div class="age pb-3">
                    <label for="" class="form-labal">Age:</label>
                    <input type="number" class="form-control" id="age">
                </div>

                <div class="height pb-3">
                    <label for="" class="form-labal">Height:</label>
                    <input type="number" class="form-control" id="height">
                </div>

                <div class="weight pb-3">
                    <label for="" class="form-labal">Weight:</label>
                    <input type="number" class="form-control" id="weight">
                </div>

                <button class="btn rounded bg-primary" onclick="BMICalculate()">Calculate</button>
                <div class="result d-flex flex-row justify-content-center">
                    <div class="fs-2 fw-bold" id="bmicalculate"></div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
