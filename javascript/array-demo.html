<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script>
        var movies = ["ramayana", "jailer-2"];

        function LoadMovies(){
            document.getElementById('lstMovies').innerHTML="";
            movies.map(function(movie){
                var option = document.createElement("option");
                option.text = movie.toUpperCase();
                option.value = movie;
                document.getElementById("lstMovies").appendChild(option);
            })
            document.getElementById("lblCount").innerHTML = `Total Number of Movies: ${movies.length}`;
        }

        function AddMovie(){
            var movieName = document.getElementById("txtMovie").value;
            movies.push(movieName);
            alert(`${movieName} Added to List`);
            LoadMovies()
            document.getElementById("txtMovie").value = "";
        }

        function SortAsc(){
            movies.sort()
            LoadMovies()
        }

        function SortDesc(){
            movies.sort().reverse()
            LoadMovies()
        }

        function DeleteMovie(){
            var selectedMovieName = document.getElementById("lstMovies").value;
            var selectMovieIndex = movies.indexOf(selectedMovieName);
            var flag = confirm(`Are you sure? \nWant to delete ${selectedMovieName}`)
            if(flag===true){
                movies.splice(selectMovieIndex,1);
                LoadMovies()
            }
        }

        function EditClick(){
            document.getElementById("txtEditMovie").value = document.getElementById("lstMovies").value;

        }

        function SaveClick(){
            var selectedMovieName = document.getElementById("lstMovies").value;
            var selectMovieIndex = movies.indexOf(selectedMovieName);
            var editedMoviesName = document.getElementById("txtEditMovie").value
            movies[selectMovieIndex] = editedMoviesName;
            LoadMovies();
        }
    </script>
</head>
<body class="container-fluid" onload="LoadMovies()">
    <header class="d-flex fs-4 fw-bold justify-content-center p-2 bg-dark text-white">
        <div>Admin - <span class="bi bi-film"></span> Movies Dashboard</div>
    </header>

    <section class="w-50 mt-4">
        <div>
            <div class="input-group">
            <input type="text" placeholder="New Movie Name" class="form-control" id="txtMovie">
            <button class="btn btn-dark" onclick="AddMovie()">Add</button>
        </div>
        </div>
        <div class="mt-3">
            <div class="mb-1">
                <button class="btn btn-warning bi bi-sort-alpha-down" onclick="SortAsc()"></button>
                <button class="btn btn-warning bi bi-sort-alpha-up" onclick="SortDesc()"></button>
            </div>
            <select name="" class="form-select" size="4" id="lstMovies">

            </select>

            <label for="" id="lblCount" class="form-label fw-bold"></label>

            <div class="mt-2">
                <button onclick="EditClick()" data-bs-target="#edit" data-bs-toggle="modal" class="btn btn-warning bi bi-pen-fill"> Edit</button>
                <div class="modal fade" id="edit" >
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h2>Edit Movie</h2>
                            </div>
                            <div class="modal-body">
                                <input type="text" id="txtEditMovie" class="form-control">
                            </div>
                            <div class="modal-footer">
                                <button data-bs-dismiss="modal" class="btn btn-success" onclick="SaveClick()">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-outline-danger bi bi-trash" onclick="DeleteMovie()"> Delete</button>
                <button class="btn btn-danger bi bi-trash-fill"> Clear All</button>
            </div>
        </div>
    </section>
    
</body>
</html>
