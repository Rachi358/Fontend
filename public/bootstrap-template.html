<!DOCTYPE html>
<html lang="en">
<head>
    <title>bootstrap-template</title>
    <meta name="viewport" content="width=device-width, initial">
    <meta name="keyword" content="">
    <link rel="shortcut icon" href="./public/images/fevicon.ico">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        header{
                background-color: #8d07ae;
                color: white;
                padding: 10px;
                font-family: Arial;
                font-size: 20px;
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
        }
        nav span{
            padding-right: 20px;
        }
        .search-bar{
            background-color: #690383;
            padding: 10px;
            width: 300px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            font-size: 16px;
            border-radius: 5px;
            align-items: center;
        }
        .btn-cmd{
            background-color: #360143;
            padding: 5px;
            border-radius: 5px;
        }
        .shortcuts{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 250px;
        }
        aside span{
            padding-right: 10px;
        }
    </style>

</head>

<body>
    <header>
       
            <div>
                <nav>
                    <span class="bi bi-bootstrap-fill"></span>
                    <span>Docs</span>
                    <span>Example</span>
                    <span>Icons</span>
                    <span>Blog</span>
                </nav>
            </div>
            <div class="search-bar">
                <div>
                    <div>
                        <span class="bi bi-search"></span>
                        <span>Search</span>
                    </div>
                </div>
                <div>
                    <div class="btn-cmd">
                        <span class="bi bi-command"></span>
                        <span>K</span>
                    </div>
                </div>
            </div>
       
        <div class="shortcuts">
            <div>
                <aside>
                    <span class="bi bi-github"></span>
                    <span class="bi bi-twitter"></span>
                    <span class="bi bi-opencollective"></span>
                </aside>
            </div>
            <div>
                <span>v5.3 <span class="bi bi-chevron-down"></span></span>
                <span class="bi bi-sun-fill"> <span class="bi bi-chevron-down"></span></span>
            </div>
        </div>
    </header>

</body>

</html>
