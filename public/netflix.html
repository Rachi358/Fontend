<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body {
            height: 100vh;
            background-image: url("./images/netflix-banner.jpg");
            background-size: cover;
        }

        .shade {
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            margin-top: -10px;
            margin-left: -10px;
            width: 102%;
        }

        header {
            color: white;
            padding: 50px 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Arial;
        }

        .brand-title {
            color: red;
            font-size: 50px;
            font-weight: bold;
        }

        .language {
            border: 1px solid lightgray;
            padding: 5px;
            width: 120px;
            display: flex;
            justify-content: space-between;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .btn-signin {
            background-color: red;
            color: white;
            padding: 5px;
            border-radius: 5px;
            width: 80px;
            text-align: center;
            margin-left: 20px;
        }

        .shortcuts {
            display: flex;
            align-items: center;
        }

        main {
            color: white;
            text-align: center;
            font-family: Arial;
            padding-top: 50px;
        }

        .main-title {
            font-size: 50px;
            font-weight: bold;
        }

        .main-subtitle {
            font-size: 25px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        section {
            margin-top: 20px;
        }

        .form {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .email {
            border: 1px solid lightgray;
            padding: 15px;
            text-align: left;
            width: 250px;
            background-color: rgba(0, 0, 0, 0.7);
            margin-right: 20px;
        }

        .btn-start {
            background-color: red;
            padding: 15px;
            width: 150px;
        }
    </style>
</head>

<body>
    <div class="shade">
        <header>
            <div>
                <span class="brand-title">NETFLIX</span>
            </div>
            <div class="shortcuts">
                <div class="language">
                    <span class="bi bi-translate"></span>
                    <span>English</span>
                    <span class="bi bi-chevron-down"></span>
                </div>
                <div class="btn-signin">Sign In</div>
            </div>
        </header>
        <main>
            <div class="main-title">Unlimited Movies,<br> shows, and more</div>
            <div class="main-subtitle">Starts at &#8377;149. Cancel at any time </div>
            <section>
                <div>Ready to watch? Enter your email to create or restart your membership.</div>
                <div class="form">
                    <div class="email">Email address</div>
                    <div class="btn-start">Get Started <span class="bi bi-chevron-right"></span> </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
